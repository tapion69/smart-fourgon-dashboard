name: Feature request
description: Suggest an improvement for Smart Fourgon Dashboard
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: What problem or use case would you like to improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Expected behaviour
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: textarea
    id: entities
    attributes:
      label: Related Home Assistant entities
      description: Add example entity IDs or domains when useful.

  - type: dropdown
    id: target
    attributes:
      label: Dashboard area
      options:
        - Main overview
        - Quick status
        - Energy counters
        - Custom pages
        - Settings
        - Smartphone
        - Other
