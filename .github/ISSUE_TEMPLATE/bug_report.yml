name: Bug report
description: Report a problem with Smart Fourgon Dashboard
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Never include passwords, tokens or API keys.

  - type: input
    id: version
    attributes:
      label: Smart Fourgon version
      placeholder: "Example: 1.0.7"
    validations:
      required: true

  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "Example: 2026.10.x"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Smartphone
        - Tablet
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / application
      placeholder: "Chrome, Firefox, Home Assistant app..."

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Explain what happens and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: entities
    attributes:
      label: Related entities
      description: Include only the entity IDs that are useful for reproducing the issue.

  - type: textarea
    id: logs
    attributes:
      label: Logs / browser console
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots here.
